services:
  pattern-redis:
    image: redis:7-alpine
    container_name: pattern-redis
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Append-only persistence: once the outbox marks an event delivered, the queue is the only
    # holder of its job, so Redis must not lose accepted jobs on restart.
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD:-redis}"
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - pattern-network
    stop_grace_period: 30s
    volumes:
      - pattern-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis}\" --no-auth-warning ping | grep -q PONG"]
      start_period: 10s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
