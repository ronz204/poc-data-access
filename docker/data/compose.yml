services:
  pattern-postgres:
    image: postgres:17-alpine
    container_name: pattern-postgres
    restart: unless-stopped
    env_file: ./secrets/.env
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - pattern-network
    shm_size: 256mb
    stop_grace_period: 30s
    volumes:
      - pattern-postgres-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d/scripts:ro
      - ./bootstrap.sh:/docker-entrypoint-initdb.d/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
