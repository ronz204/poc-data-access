name: tenant

services:
  tenant-postgres:
    image: postgres:17-alpine
    container_name: tenant-postgres
    env_file: ./.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - tenant-network
    volumes:
      - tenant-postgres-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  tenant-postgres-data:
    driver: local
    name: tenant-postgres-data

networks:
  tenant-network:
    driver: bridge
    name: tenant-network
